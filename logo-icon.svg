<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="gbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B3D" />
      <stop offset="100%" stop-color="#FF3E24" />
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151C2C" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
  </defs>

  <!-- Clean Rounded Square Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgDark)" stroke="url(#gbGrad)" stroke-width="2.5" />

  <!-- Minimalist Geometric "G" Mark with Bundle/Arrow Arrowhead -->
  <path d="M 44 24 
           C 41 18 35 15 28 15 
           C 18 15 12 22 12 32 
           C 12 42 18 49 28 49 
           C 36 49 43 45 45 37 
           L 45 34 
           L 28 34" 
        fill="none" 
        stroke="url(#gbGrad)" 
        stroke-width="6.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Center Arrow Accent inside G bar -->
  <polygon points="34,30 40,34 34,38" fill="#FFFFFF" />
</svg>
