<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 56" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B3D" />
      <stop offset="100%" stop-color="#FF3E24" />
    </linearGradient>
    <linearGradient id="logoBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151C2C" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="48" height="48" rx="13" fill="url(#logoBgDark)" stroke="url(#logoGbGrad)" stroke-width="2.2" />
    <path d="M 33 18 C 30.7 13.5 26.2 11.2 21 11.2 C 13.5 11.2 9 16.5 9 24 C 9 31.5 13.5 36.8 21 36.8 C 27 36.8 32.2 33.8 33.7 27.7 L 33.7 25.5 L 21 25.5" 
          fill="none" 
          stroke="url(#logoGbGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <polygon points="25.5,22.5 30,25.5 25.5,28.5" fill="#FFFFFF" />
  </g>

  <!-- Brand Typography: "Get Bundle" -->
  <g transform="translate(64, 37)">
    <!-- "Get" in crisp white -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Outfit', -apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Get</text>
    <!-- "Bundle" in electric orange -->
    <text x="56" y="0" font-family="'Plus Jakarta Sans', 'Outfit', -apple-system, sans-serif" font-size="28" font-weight="900" fill="url(#logoGbGrad)" letter-spacing="-0.5">Bundle</text>
  </g>
</svg>
